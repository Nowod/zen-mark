<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>禅阅设置</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <main>
    <h1>禅阅</h1>
    <label class="site">
      <span><strong>当前网站</strong><small id="site-name">正在读取…</small></span>
      <input id="site-enabled" type="checkbox" role="switch" disabled>
      <span class="switch" aria-hidden="true"></span>
    </label>
    <fieldset id="fields" disabled>
      <legend>渲染内容</legend>
      <label><input id="field-precondition" type="checkbox">前置条件</label>
      <label><input id="field-steps" type="checkbox"><span>用例步骤<small>包含步骤和预期</small></span></label>
    </fieldset>
    <footer>仅改变显示，不修改用例</footer>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
