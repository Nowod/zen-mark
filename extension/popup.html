<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>禅阅设置</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" type="module"></script>
</head>
<body>
  <main>
    <h1>禅阅</h1>
    <label class="site">
      <span><strong>当前网站</strong><small id="site-name">正在读取…</small></span>
      <input id="site-enabled" type="checkbox" role="switch" disabled>
      <span class="switch" aria-hidden="true"></span>
    </label>
    <fieldset id="fields" aria-label="功能设置" disabled>
      <fieldset class="option-group">
        <legend>渲染内容</legend>
        <label><input id="field-precondition" type="checkbox">前置条件</label>
        <label><input id="field-steps" type="checkbox">步骤与预期</label>
        <label><input id="field-bugSteps" type="checkbox">Bug 重现步骤</label>
      </fieldset>
      <fieldset class="option-group">
        <legend>辅助功能</legend>
        <label><input id="field-copyCase" type="checkbox">整体复制</label>
        <label class="line-height-row">
          <span>正文行距</span>
          <select id="field-lineHeight">
            <option value="default">默认</option>
            <option value="1.5">1.5 倍</option>
            <option value="2">2 倍</option>
            <option value="2.5">2.5 倍</option>
            <option value="3">3 倍</option>
          </select>
        </label>
      </fieldset>
    </fieldset>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
